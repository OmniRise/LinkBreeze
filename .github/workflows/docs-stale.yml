name: docs-stale

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.*.md"
      - "docs/TRANSLATIONS.md"
  pull_request:
    paths:
      - "README.md"
      - "README.*.md"
      - "docs/TRANSLATIONS.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # privatized: scripts/ is local-only (gitignored) — step removed
      # - run: node scripts/docs-check.mjs
