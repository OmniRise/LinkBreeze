name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # privatized: scripts/ is local-only (gitignored) — step removed
      # - run: node scripts/check-changelog.mjs
      - run: npm run lint
      - run: npx tsc --noEmit --skipLibCheck
      # Locale gates: catch a forgotten/unsynced key or a broken placeholder in
      # ANY of the 10 locales (tsc covers key parity only; i18n:check covers the
      # sync hash; locale-audit covers placeholder + untranslated parity that
      # neither tsc nor the hash gate sees).
      - run: npm run i18n:check
      # privatized: scripts/ is local-only (gitignored) — step removed
      # - run: node scripts/locale-audit.mjs
      - run: npm run test
      - run: npm run build
