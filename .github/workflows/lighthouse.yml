name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # Use webpack (not Turbopack) for the Lighthouse build. Turbopack in
      # Next.js 16 intermittently fails to fetch Google Font woff2 files from
      # fonts.gstatic.com during page data collection in CI, producing
      # "Module not found: Can't resolve '@vercel/turbopack-next/internal/font/google/font'".
      # Lighthouse audits the output, not the bundler, so webpack is fine here.
      # Retry up to 3 times — Google Fonts occasionally rate-limits or times out.
      - name: Build with retry
        env:
          SECRET_KEY: "ci-lighthouse-secret-key-not-for-production"
          DATABASE_PATH: "/tmp/lighthouse-linkbreeze.db"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          for i in 1 2 3; do
            npx next build --webpack && break || {
              if [ $i -eq 3 ]; then
                echo "Build failed after 3 attempts"
                exit 1
              fi
              echo "Build attempt $i failed, retrying..."
              sleep 5
            }
          done

      # Seeding is privatized (scripts/ is local-only, gitignored). Instead the
      # fresh DB gets its bootstrap admin through the app's own first-run API
      # (POST /api/setup), so the homepage serves the default public page
      # (migration 0007 creates it at slug "u") instead of redirecting to /setup.

      - name: Start server
        run: |
          # output: standalone needs static assets copied next to server.js.
          # In CI the checkout is flat, so server.js is at .next/standalone/server.js.
          # In nested local dirs it may be under subdirs — find handles both.
          STANDALONE_DIR=$(dirname $(find .next/standalone -name server.js -not -path "*/node_modules/*" | head -1))
          cp -r .next/static "$STANDALONE_DIR/.next/static"
          cp -r public "$STANDALONE_DIR/public"
          cd "$STANDALONE_DIR"
          node server.js &
          cd "$GITHUB_WORKSPACE"
          # Fresh DB: no users yet, so /setup is the first-run page (200).
          # Reaching it also proves boot migrations have finished.
          npx wait-on http://localhost:3000/setup --timeout 60000
          # Give the default page real content so Lighthouse audits a
          # realistic public page, not an empty one.
          node -e "const Database=require('better-sqlite3');new Database(process.env.DATABASE_PATH).prepare('UPDATE pages SET title=?, bio=?').run('Lighthouse Test','Test page for Lighthouse CI');console.log('[lighthouse] page content seeded')"
          # Create the bootstrap admin through the app's own first-run API;
          # afterwards / serves the default public page (307 -> /u).
          curl -sf -X POST http://localhost:3000/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"test","password":"LighthouseCI123"}'
          npx wait-on http://localhost:3000/u --timeout 60000
        env:
          SECRET_KEY: "ci-lighthouse-secret-key-not-for-production"
          DATABASE_PATH: "/tmp/lighthouse-linkbreeze.db"
          PORT: "3000"

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npm install -g @lhci/cli@0.15.x --ignore-scripts
          lhci autorun --upload.target=temporary-public-storage || echo "LHCI warnings — check report artifact"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
