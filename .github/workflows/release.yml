name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_test:
        description: "Build AND push omnirise/linkbreeze:test (multi-arch, no version tag, no GitHub release)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: omnirise/linkbreeze

jobs:
  setup:
    name: Determine publish mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Set publish mode
        id: mode
        run: |
          # dispatch + publish_test=false -> dry-run | dispatch + true -> test tag | tag push -> release
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish_test }}" = "true" ]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dryrun" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: needs.setup.outputs.mode != 'dryrun'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dry-run path (workflow_dispatch, publish_test=false): build only, push nothing.
      - name: Build (dry-run)
        if: needs.setup.outputs.mode == 'dryrun'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      # Build and push by digest; the manifest list is assembled by the merge job.
      - name: Build and push by digest
        id: build-hub
        if: needs.setup.outputs.mode != 'dryrun'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: needs.setup.outputs.mode != 'dryrun'
        run: |
          mkdir -p /tmp/digests
          hub_digest="${{ steps.build-hub.outputs.digest }}"
          touch "/tmp/digests/hub-${hub_digest#sha256:}"

      - name: Upload digest
        if: needs.setup.outputs.mode != 'dryrun'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest list
    if: needs.setup.outputs.mode != 'dryrun'
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Prepare
        run: |
          echo "HUB_IMAGE=${DOCKERHUB_IMAGE}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release path: latest + <version> tags. Test path: just :test.
      - name: Docker meta (release)
        if: needs.setup.outputs.mode == 'release'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Docker meta (test)
        if: needs.setup.outputs.mode == 'test'
        id: meta-test
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: |
            type=raw,value=test

      - name: Create manifest list and push (Docker Hub)
        working-directory: /tmp/digests
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digests=""
          for f in hub-*; do digests="$digests ${{ env.HUB_IMAGE }}@sha256:${f#hub-}"; done
          # Intentional word splitting: $tags and $digests are multi-word arg lists.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $digests

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.HUB_IMAGE }}:${{ steps.meta.outputs.version || steps.meta-test.outputs.version }}"

  # Website sync: the marketing site is the source of truth for update checks
  # (linkbreeze.omnirise.dev/latest-version.json). On a release tag, copy this
  # repo's prepared latest-version.json (version/releasedAt/notes edited as
  # part of release prep) into the website repo and open a PR — merging it
  # deploys the new update-banner data via Vercel. The url field is always
  # forced to the canonical GitHub release so the banner link can never point
  # at a mirror. Requires the WEBSITE_SYNC_TOKEN secret (PAT with repo scope
  # on OmniRise/LinkBreeze-Website).
  website-sync:
    name: Sync latest-version.json to website (PR)
    if: needs.setup.outputs.mode == 'release'
    runs-on: ubuntu-latest
    needs: [setup, merge]
    steps:
      - uses: actions/checkout@v7

      - name: Check out website repo
        uses: actions/checkout@v7
        with:
          repository: OmniRise/LinkBreeze-Website
          token: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          path: website

      - name: Update website latest-version.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg url "https://github.com/OmniRise/LinkBreeze/releases/tag/${TAG}" \
            '.url = $url' \
            latest-version.json > website/public/latest-version.json
          cat website/public/latest-version.json

      - name: Open or update PR on the website repo
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd website
          git config user.name "linkbreeze-release-bot"
          git config user.email "bot@users.noreply.github.com"
          BRANCH="release-sync/${TAG}"
          # -B resets stale local state; --force overwrites the remote branch.
          # The branch is bot-owned per tag, so re-cutting a release replaces
          # the previous attempt instead of failing the job on a
          # non-fast-forward (the branch already exists from the first cut).
          git checkout -B "$BRANCH"
          git commit -m "chore(release): sync latest-version.json for ${TAG}" -- public/latest-version.json
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" -R OmniRise/LinkBreeze-Website --json state --jq .state >/dev/null 2>&1; then
            gh pr comment "$BRANCH" -R OmniRise/LinkBreeze-Website \
              --body "Re-synced for the re-cut ${TAG}: the branch was force-updated with the final latest-version.json."
          else
            gh pr create -R OmniRise/LinkBreeze-Website \
              --base main --head "$BRANCH" \
              --title "Release sync: ${TAG}" \
              --body "Automated sync of \`public/latest-version.json\` for ${TAG} (source: LinkBreeze release workflow). Merge to deploy the new update-banner data."
          fi
